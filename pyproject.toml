[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sasa-reproduction"
version = "0.1.0"
description = "Reproduction framework for Self-Aware Safety Augmentation (SASA)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SASA reproduction contributors"}]
dependencies = [
  "torch>=2.2",
  "transformers>=4.49,<5",
  "accelerate>=0.30",
  "pillow>=10",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4",
  "pyyaml>=6",
  "joblib>=1.3",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

